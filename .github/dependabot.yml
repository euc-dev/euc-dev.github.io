version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-github-actions:
          applies-to: version-updates
          patterns:
              - '*'
    cooldown:
      default-days: 5
      include:
          - '*'

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      all-pip:
          applies-to: version-updates
          patterns:
              - '*'
    cooldown:
      default-days: 5
      include:
          - '*'
